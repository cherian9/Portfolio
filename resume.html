<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume | Cherian Chirackal Joseph</title>
    <meta name="description" content="View and download the resume of Cherian Chirackal Joseph — Developer, Problem Solver, and Learner.">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ===== Resume Page Styles ===== */
        .resume-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* PDF Viewer Container */
        .resume-viewer {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #f8fafc 0%, #f0f9ff 100%);
            padding: 0;
        }

        .pdf-container {
            flex: 1;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px 40px;
            animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) both;
        }

        .pdf-wrapper {
            background: #ffffff;
            border-radius: 16px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.1),
                0 0 0 1px rgba(255, 255, 255, 0.5);
            overflow: hidden;
            position: relative;
        }

        .pdf-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .pdf-toolbar-title {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pdf-toolbar-title svg {
            width: 16px;
            height: 16px;
            opacity: 0.7;
        }

        .pdf-toolbar-actions {
            display: flex;
            gap: 8px;
        }

        .toolbar-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            font-family: inherit;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        .toolbar-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .toolbar-btn svg {
            width: 14px;
            height: 14px;
        }

        .pdf-frame {
            width: 100%;
            height: calc(100vh - 70px - 56px - 40px);
            min-height: 500px;
            border: none;
            display: block;
        }

        /* Responsive — fill the screen on mobile */
        @media (max-width: 768px) {
            .pdf-container {
                padding: 8px;
                max-width: 100%;
            }

            .pdf-wrapper {
                border-radius: 10px;
            }

            .pdf-frame {
                height: calc(100vh - 70px - 50px - 16px);
                min-height: 400px;
            }

            .pdf-toolbar {
                padding: 10px 12px;
                gap: 8px;
            }

            .pdf-toolbar-title {
                font-size: 12px;
            }

            .toolbar-btn {
                padding: 6px 10px;
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .pdf-container {
                padding: 4px;
            }

            .pdf-wrapper {
                border-radius: 8px;
            }

            .pdf-frame {
                height: calc(100vh - 70px - 46px - 8px);
                min-height: 350px;
            }

            .pdf-toolbar {
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body class="resume-page">
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html">Cherian Chirackal Joseph</a>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html#home" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="index.html#about" class="nav-link">About</a>
                </li>
                <li class="nav-item">
                    <a href="index.html#projects" class="nav-link">Projects</a>
                </li>
                <li class="nav-item">
                    <a href="index.html#skills" class="nav-link">Skills</a>
                </li>
                <li class="nav-item">
                    <a href="index.html#certificates" class="nav-link">Certificates</a>
                </li>
                <li class="nav-item">
                    <a href="index.html#contact" class="nav-link">Contact</a>
                </li>
                <li class="nav-item">
                    <a href="resume.html" class="nav-link" style="color: var(--primary-color);">Resume</a>
                </li>
            </ul>
            <div class="hamburger" id="hamburger-resume">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>



    <!-- PDF Viewer -->
    <section class="resume-viewer">
        <div class="pdf-container">
            <div class="pdf-wrapper">
                <div class="pdf-toolbar">
                    <div class="pdf-toolbar-title">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        Cherian-resume.pdf
                    </div>
                    <div class="pdf-toolbar-actions">
                        <button onclick="downloadResume()" class="toolbar-btn" id="toolbar-download-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            Download
                        </button>
                        <a href="Cherian-resume.pdf" target="_blank" class="toolbar-btn" id="toolbar-open-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                            Open
                        </a>
                    </div>
                </div>
                <iframe src="Cherian-resume.pdf" class="pdf-frame" title="Cherian Chirackal Joseph Resume"></iframe>

            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Cherian Chirackal Joseph. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Hamburger menu toggle for resume page
        const hamburger = document.getElementById('hamburger-resume');
        const navMenu = document.querySelector('.nav-menu');

        if (hamburger) {
            hamburger.addEventListener('click', () => {
                hamburger.classList.toggle('active');
                navMenu.classList.toggle('active');
            });
        }

        // Close menu when clicking a nav link
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                hamburger.classList.remove('active');
                navMenu.classList.remove('active');
            });
        });

        // Reliable download function that works on all devices including mobile
        function downloadResume() {
            fetch('Cherian-resume.pdf')
                .then(response => response.blob())
                .then(blob => {
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'Cherian-resume.pdf';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                })
                .catch(() => {
                    // Fallback: open in new tab if fetch fails
                    window.open('Cherian-resume.pdf', '_blank');
                });
        }
    </script>
</body>
</html>
